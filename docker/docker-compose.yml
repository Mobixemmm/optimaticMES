services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: mes_timescaledb
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway123
      POSTGRES_DB: machine_data
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: mes_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mes.pl
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - timescaledb
    restart: unless-stopped

volumes:
  timescale_data: