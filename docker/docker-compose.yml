version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: mes_postgres
    environment:
      POSTGRES_USER: mes_admin
      POSTGRES_PASSWORD: mes_haslo_123
      POSTGRES_DB: mes_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: mes_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: mes_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mes.pl
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  