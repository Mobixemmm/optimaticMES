name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test -- --ci
      - name: Lint
        # TODO: usunąć continue-on-error po sformatowaniu kodu (npm run lint)
        continue-on-error: true
        run: npm run lint:check

  frontend:
    name: Frontend (TanStack Start)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Lint
        # TODO: usunąć continue-on-error po sformatowaniu kodu (npm run lint)
        continue-on-error: true
        run: npm run lint:check

  database:
    name: Database schema (TimescaleDB)
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: machine_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply SQL migrations
        env:
          PGPASSWORD: ci
        run: |
          for f in database/*.sql; do
            echo "::group::$f"
            psql -v ON_ERROR_STOP=1 -h localhost -U ci -d machine_data -f "$f"
            echo "::endgroup::"
          done
