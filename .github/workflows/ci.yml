name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # @tanstack/start-* wymaga Node >=22.12.0 (patrz frontend/Dockerfile) —
          # Node 20 przechodzi tu tylko z ostrzeżeniami EBADENGINE, nie testujmy na nim.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` na tym drzewie zależności (eslint 9 + zagnieżdżone ajv 6.x/8.x)
      # rzuca fałszywym "lock file ... does not satisfy" mimo spójnego lockfile'a —
      # patrz frontend/Dockerfile. `npm install` nadal respektuje zablokowane wersje.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
